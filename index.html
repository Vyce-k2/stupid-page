<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL SYSTEM ERROR</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .red { color: #ff0000; font-weight: bold; }
        .blink { animation: blinker 0.8s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <p class="red blink">[!] CRITICAL SYSTEM VULNERABILITY DETECTED</p>
        <p>[+] Injecting payload...</p>
        <p>[+] Bypassing firewall security...</p>
        <p>[+] Extracting Discord Session Tokens...</p>
        <p>[+] Accessing Saved Passwords...</p>
        <p class="red">[!] SYSTEM COMPROMISED - EXFILTRATING DATA...</p>
    </div>

    <script>
        // Trigger device vibration if supported
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 500]);
        }

        // Redirect after 5 seconds automatically without showing a visible timer
        setTimeout(() => {
            window.location.href = "about:blank";
        }, 5000);
    </script>
</body>
</html>
